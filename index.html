    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 15px;
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid #ffd700;
      padding: 10px 15px;
      border-radius: 12px;
    }
    .balance { color: #ffd700; font-weight: bold; font-size: 1.1rem; }
    .board {
      width: 100%;
      max-width: 380px;
      background: rgba(0, 0, 0, 0.6);
      border: 3px solid #d4af37;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
      text-align: center;
      margin: 15px 0;
    }
    .dice-area {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
      background: #1a0505;
      padding: 15px;
      border-radius: 15px;
      border: 1px dashed #ffd700;
    }
    .dice {
      width: 50px;
      height: 50px;
      background: #fff;
      color: #000;
      border-radius: 10px;
      font-size: 2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
    }
    .bet-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 15px;
    }
    .btn-bet {
      background: linear-gradient(180deg, #b8860b 0%, #8b6508 100%);
      border: 2px solid #ffd700;
      color: #fff;
      padding: 15px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-bet:active { transform: scale(0.95); }
    .btn-tai { background: linear-gradient(180deg, #c0392b 0%, #7d1007 100%); }
    .btn-xiu { background: linear-gradient(180deg, #2980b9 0%, #114e7a 100%); }
    .chips {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }
    .chip {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px dashed #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      background: #d4af37;
      color: #000;
    }
    .chip.active { border: 3px solid #fff; box-shadow: 0 0 10px #fff; }
    .status { margin-top: 10px; font-size: 1.1rem; color: #ffd700; height: 25px; }
  </style>
</head>
